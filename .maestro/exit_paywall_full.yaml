appId: com.balaklrapps.newlivingtranslation
name: Exit paywall full path
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Continue"
    timeout: 25000
- tapOn: "Continue"
- waitForAnimationToEnd
# Dismiss UMP consent if present (once)
- runFlow:
    when:
      visible: "Do not consent"
    commands:
      - tapOn: "Do not consent"
      - waitForAnimationToEnd
- extendedWaitUntil:
    notVisible: "Do not consent"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: "Allow Tracking"
    commands:
      - tapOn: "Ask App Not to Track"
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
# Step 1
- extendedWaitUntil:
    visible: "Deepen my faith"
    timeout: 20000
- tapOn: "Deepen my faith"
- tapOn: "Continue"
- waitForAnimationToEnd
# Step 2 — full label (en dash)
- extendedWaitUntil:
    visible: "Which age group are you in?"
    timeout: 15000
- tapOn: "25–34"
- tapOn: "Continue"
- waitForAnimationToEnd
# Step 3
- extendedWaitUntil:
    visible: "Feeling distant from God"
    timeout: 10000
- tapOn: "Feeling distant from God"
- tapOn: "Continue"
- waitForAnimationToEnd
# Step 4
- extendedWaitUntil:
    visible: "Every day"
    timeout: 10000
- tapOn: "Every day"
- tapOn: "Continue"
- waitForAnimationToEnd
# Step 5
- extendedWaitUntil:
    visible: "Highlighting key verses"
    timeout: 10000
- tapOn: "Highlighting key verses"
- tapOn: "Continue"
- waitForAnimationToEnd
- takeScreenshot: after_survey
- repeat:
    times: 18
    commands:
      - runFlow:
          when:
            visible: "Do not consent"
          commands:
            - tapOn: "Do not consent"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "Allow"
          commands:
            - tapOn: "Allow"
      - runFlow:
          when:
            visible: "Don't Allow"
          commands:
            - tapOn: "Don't Allow"
      - runFlow:
          when:
            visible: "Ask App Not to Track"
          commands:
            - tapOn: "Ask App Not to Track"
      - runFlow:
          when:
            visible: "Not Now"
          commands:
            - tapOn: "Not Now"
      - runFlow:
          when:
            visible: "Skip"
          commands:
            - tapOn: "Skip"
      - runFlow:
          when:
            visible: "Get Started"
          commands:
            - tapOn: "Get Started"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "Continue"
          commands:
            - tapOn: "Continue"
            - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "Next"
          commands:
            - tapOn: "Next"
            - waitForAnimationToEnd
- takeScreenshot: after_advances
- runFlow:
    when:
      visible: "Restore Purchases"
    commands:
      - takeScreenshot: main_paywall
      - tapOn:
          point: "92%,7%"
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: after_paywall_close
- runFlow:
    when:
      visible: "Before you go"
    commands:
      - takeScreenshot: exit_offer
      - tapOn:
          text: "Claim.*"
      - waitForAnimationToEnd:
          timeout: 15000
      - takeScreenshot: after_claim
- runFlow:
    when:
      visible: "You're Already"
    commands:
      - takeScreenshot: already_dialog
- runFlow:
    when:
      visible: "Restore My Current Plan"
    commands:
      - takeScreenshot: restore_my_plan
- runFlow:
    when:
      visible: "Yes, Restore"
    commands:
      - takeScreenshot: yes_restore
- runFlow:
    when:
      visible: "Would You like to Restore"
    commands:
      - takeScreenshot: would_restore
- takeScreenshot: final_state
